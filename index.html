<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪中紅梅</title>
<style>
  :root{
    --snow: #F3F1E9;
    --snow-deep: #E7E3D3;
    --ink-1: #C9CBC0;
    --ink-2: #8E9188;
    --ink-3: #565650;
    --ink-4: #2A2925;
    --plum: #A6342A;
    --plum-deep: #7C2620;
    --plum-soft: #C97A6C;
  }

  *{ margin:0; padding:0; box-sizing: border-box; }

  html, body{
    height: 100%;
    background: var(--snow);
    overflow: hidden;
  }

  .scene{
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at 70% 15%, rgba(0,0,0,0.03), transparent 55%),
      radial-gradient(ellipse at 15% 90%, rgba(0,0,0,0.04), transparent 60%),
      var(--snow);
  }

  .scene svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 遠處淡山，極安靜 */
  .far-hill{ opacity: 0.35; }

  /* 枝幹極輕微搖曳 */
  .branch{
    animation: sway 9s ease-in-out infinite;
    transform-origin: 60px 900px;
  }
  @keyframes sway{
    0%, 100% { transform: rotate(-0.4deg); }
    50%      { transform: rotate(0.4deg); }
  }

  .blossom{
    animation: bloom 5s ease-in-out infinite;
  }
  @keyframes bloom{
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 1; }
  }

  /* 飄雪 */
  .snowfall circle{
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall{
    0%   { transform: translate(0, -40px); opacity: 0; }
    8%   { opacity: 0.95; }
    92%  { opacity: 0.9; }
    100% { transform: translate(-60px, 940px); opacity: 0; }
  }

  .snowfall .drift-r circle{ animation-name: fall-r; }
  @keyframes fall-r{
    0%   { transform: translate(0, -40px); opacity: 0; }
    8%   { opacity: 0.95; }
    92%  { opacity: 0.9; }
    100% { transform: translate(70px, 940px); opacity: 0; }
  }

  .snowfall .drift-far circle{ animation-name: fall-far; }
  @keyframes fall-far{
    0%   { transform: translate(0, -40px); opacity: 0; }
    8%   { opacity: 0.55; }
    92%  { opacity: 0.5; }
    100% { transform: translate(-30px, 940px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .branch, .blossom, .snowfall circle{
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">

    <!-- 遠山，極淡的雪意留白 -->
    <path class="far-hill" d="M0,260 Q220,190 460,240 T940,220 T1440,250 L1440,0 L0,0 Z"
          fill="var(--ink-1)" opacity="0"/>
    <path class="far-hill" d="M0,300 Q240,220 500,270 T980,250 T1440,280 L1440,0 L0,0 Z"
          fill="none"/>
    <path d="M0,0 L1440,0 L1440,300 Q980,250 500,270 Q240,220 0,300 Z" fill="var(--ink-1)" opacity="0.28"/>

    <!-- 雪地地面，留白起伏 -->
    <path d="M0,900 L0,760 Q300,720 620,745 T1180,730 T1440,750 L1440,900 Z" fill="var(--snow-deep)"/>
    <path d="M0,900 L0,800 Q360,775 700,795 T1440,790 L1440,900 Z" fill="var(--ink-1)" opacity="0.18"/>

    <!-- ============ 梅枝（自左下向右上斜出，水墨飛白筆法） ============ -->
    <g class="branch" stroke="var(--ink-4)" stroke-linecap="round" fill="none">
      <!-- 主幹 -->
      <path d="M -20 900 C 60 760, 40 640, 140 560 C 220 495, 260 470, 340 430"
            stroke-width="16" opacity="0.92"/>
      <path d="M -20 900 C 60 760, 40 640, 140 560 C 220 495, 260 470, 340 430"
            stroke-width="16" opacity="0.35" stroke-dasharray="2 10"/>

      <!-- 分枝 1 -->
      <path d="M 170 610 C 240 590, 300 540, 380 520 C 440 505, 480 470, 520 420"
            stroke-width="7" opacity="0.85"/>
      <!-- 分枝 1 的細梢 -->
      <path d="M 460 460 C 500 430, 520 400, 560 370" stroke-width="3" opacity="0.75"/>
      <path d="M 400 500 C 380 460, 390 420, 360 380" stroke-width="2.4" opacity="0.7"/>

      <!-- 分枝 2 -->
      <path d="M 260 500 C 320 470, 360 420, 420 390 C 470 365, 520 360, 580 330"
            stroke-width="6" opacity="0.85"/>
      <path d="M 500 370 C 540 340, 560 310, 610 290" stroke-width="2.6" opacity="0.7"/>

      <!-- 分枝 3（向右下探出，打破構圖對稱） -->
      <path d="M 220 640 C 300 660, 360 650, 430 600"
            stroke-width="4" opacity="0.75"/>

      <!-- 主幹延伸細梢，指向畫面右上留白 -->
      <path d="M 340 430 C 400 390, 430 360, 500 320 C 550 292, 590 280, 660 250"
            stroke-width="4.5" opacity="0.8"/>
      <path d="M 560 300 C 600 275, 630 260, 690 235" stroke-width="2.2" opacity="0.65"/>
      <path d="M 480 340 C 460 310, 470 285, 445 255" stroke-width="1.8" opacity="0.6"/>
    </g>

    <!-- ============ 紅梅花朵 ============ -->
    <g class="blossom">
      <!-- 五瓣梅花，簡化為圓瓣叢 -->
      <g transform="translate(360,420)">
        <circle cx="-7" cy="-3" r="7" fill="var(--plum)"/>
        <circle cx="7" cy="-3" r="7" fill="var(--plum)"/>
        <circle cx="0" cy="7" r="7" fill="var(--plum-deep)"/>
        <circle cx="-9" cy="6" r="6" fill="var(--plum-soft)"/>
        <circle cx="9" cy="6" r="6" fill="var(--plum-soft)"/>
        <circle cx="0" cy="0" r="3" fill="var(--plum-deep)"/>
      </g>

      <g transform="translate(560,368) scale(0.75)">
        <circle cx="-7" cy="-3" r="7" fill="var(--plum-soft)"/>
        <circle cx="7" cy="-3" r="7" fill="var(--plum)"/>
        <circle cx="0" cy="7" r="7" fill="var(--plum)"/>
        <circle cx="-9" cy="6" r="6" fill="var(--plum-deep)"/>
        <circle cx="9" cy="6" r="6" fill="var(--plum-soft)"/>
      </g>

      <g transform="translate(610,288) scale(0.6)">
        <circle cx="-7" cy="-3" r="7" fill="var(--plum)"/>
        <circle cx="7" cy="-3" r="7" fill="var(--plum-soft)"/>
        <circle cx="0" cy="7" r="7" fill="var(--plum-deep)"/>
        <circle cx="-9" cy="6" r="6" fill="var(--plum)"/>
        <circle cx="9" cy="6" r="6" fill="var(--plum)"/>
      </g>

      <g transform="translate(690,233) scale(0.5)">
        <circle cx="-7" cy="-3" r="7" fill="var(--plum-deep)"/>
        <circle cx="7" cy="-3" r="7" fill="var(--plum)"/>
        <circle cx="0" cy="7" r="7" fill="var(--plum-soft)"/>
        <circle cx="-9" cy="6" r="6" fill="var(--plum)"/>
        <circle cx="9" cy="6" r="6" fill="var(--plum-deep)"/>
      </g>

      <!-- 幾朵含苞未放，僅一點紅 -->
      <circle cx="440" cy="390" r="5" fill="var(--plum)"/>
      <circle cx="500" cy="320" r="4.5" fill="var(--plum-deep)"/>
      <circle cx="240" cy="560" r="4" fill="var(--plum-soft)"/>
      <circle cx="420" cy="600" r="4" fill="var(--plum)"/>
      <circle cx="580" cy="330" r="3.5" fill="var(--plum)"/>
      <circle cx="180" cy="600" r="4.5" fill="var(--plum-deep)"/>
    </g>

    <!-- 枝上積雪，留白處以極淡灰標示 -->
    <g fill="var(--snow)" opacity="0.85">
      <ellipse cx="150" cy="555" rx="18" ry="7" transform="rotate(-35 150 555)"/>
      <ellipse cx="280" cy="465" rx="14" ry="6" transform="rotate(-30 280 465)"/>
      <ellipse cx="420" cy="395" rx="12" ry="5" transform="rotate(-25 420 395)"/>
    </g>

    <!-- ============ 飄雪（大雪：三層雪粒＋風向飄移） ============ -->
    <g class="snowfall">

      <!-- 遠層：小而淡，數量多，速度慢 -->
      <g class="drift-far" fill="var(--ink-1)" opacity="0.5">
        <circle cx="40"   cy="0" r="1.3" style="animation-duration:14s; animation-delay:0s;"/>
        <circle cx="130"  cy="0" r="1.1" style="animation-duration:16s; animation-delay:2.1s;"/>
        <circle cx="210"  cy="0" r="1.4" style="animation-duration:13s; animation-delay:4.4s;"/>
        <circle cx="300"  cy="0" r="1.2" style="animation-duration:15s; animation-delay:1.3s;"/>
        <circle cx="390"  cy="0" r="1.5" style="animation-duration:12.5s; animation-delay:3.6s;"/>
        <circle cx="470"  cy="0" r="1.1" style="animation-duration:17s; animation-delay:0.6s;"/>
        <circle cx="560"  cy="0" r="1.3" style="animation-duration:14.5s; animation-delay:5s;"/>
        <circle cx="650"  cy="0" r="1.2" style="animation-duration:13.5s; animation-delay:2.8s;"/>
        <circle cx="730"  cy="0" r="1.4" style="animation-duration:16s; animation-delay:0.9s;"/>
        <circle cx="820"  cy="0" r="1.1" style="animation-duration:15.5s; animation-delay:4.1s;"/>
        <circle cx="900"  cy="0" r="1.3" style="animation-duration:13s; animation-delay:1.7s;"/>
        <circle cx="990"  cy="0" r="1.2" style="animation-duration:14s; animation-delay:3.2s;"/>
        <circle cx="1070" cy="0" r="1.5" style="animation-duration:16.5s; animation-delay:0.3s;"/>
        <circle cx="1150" cy="0" r="1.1" style="animation-duration:12.8s; animation-delay:4.7s;"/>
        <circle cx="1240" cy="0" r="1.4" style="animation-duration:15s; animation-delay:2.4s;"/>
        <circle cx="1320" cy="0" r="1.2" style="animation-duration:13.6s; animation-delay:0.1s;"/>
        <circle cx="1400" cy="0" r="1.3" style="animation-duration:14.8s; animation-delay:3.9s;"/>
        <circle cx="80"   cy="0" r="1.1" style="animation-duration:17.5s; animation-delay:5.4s;"/>
        <circle cx="960"  cy="0" r="1.3" style="animation-duration:13.2s; animation-delay:1s;"/>
        <circle cx="1380" cy="0" r="1.2" style="animation-duration:15.8s; animation-delay:2.6s;"/>
      </g>

      <!-- 中層：主體雪粒 -->
      <g fill="var(--ink-2)" opacity="0.75">
        <circle cx="60"   cy="0" r="2.4" style="animation-duration:8s;   animation-delay:0s;"/>
        <circle cx="150"  cy="0" r="1.8" style="animation-duration:9.5s; animation-delay:1.2s;"/>
        <circle cx="230"  cy="0" r="2.6" style="animation-duration:7.2s; animation-delay:2.4s;"/>
        <circle cx="320"  cy="0" r="2s"  style="animation-duration:8.8s; animation-delay:0.6s;"/>
        <circle cx="400"  cy="0" r="2.3" style="animation-duration:7.6s; animation-delay:3.1s;"/>
        <circle cx="480"  cy="0" r="1.9" style="animation-duration:9s;   animation-delay:1.8s;"/>
        <circle cx="560"  cy="0" r="2.5" style="animation-duration:8.2s; animation-delay:4s;"/>
        <circle cx="640"  cy="0" r="2.1" style="animation-duration:7.8s; animation-delay:0.3s;"/>
        <circle cx="720"  cy="0" r="2.4" style="animation-duration:8.6s; animation-delay:2.7s;"/>
        <circle cx="800"  cy="0" r="1.8" style="animation-duration:9.3s; animation-delay:1s;"/>
        <circle cx="880"  cy="0" r="2.6" style="animation-duration:7.4s; animation-delay:3.5s;"/>
        <circle cx="960"  cy="0" r="2s"  style="animation-duration:8.4s; animation-delay:0.9s;"/>
        <circle cx="1040" cy="0" r="2.3" style="animation-duration:7.9s; animation-delay:4.3s;"/>
        <circle cx="1120" cy="0" r="1.9" style="animation-duration:9.1s; animation-delay:2s;"/>
        <circle cx="1200" cy="0" r="2.5" style="animation-duration:8s;   animation-delay:0.5s;"/>
        <circle cx="1280" cy="0" r="2.1" style="animation-duration:8.7s; animation-delay:3.8s;"/>
        <circle cx="1360" cy="0" r="2.4" style="animation-duration:7.5s; animation-delay:1.5s;"/>
        <circle cx="1420" cy="0" r="1.8" style="animation-duration:9.4s; animation-delay:4.6s;"/>
        <circle cx="20"   cy="0" r="2.2" style="animation-duration:8.3s; animation-delay:2.2s;"/>
        <circle cx="1000" cy="0" r="2s"  style="animation-duration:7.7s; animation-delay:0.2s;"/>
      </g>

      <!-- 近層（往右飄）：大而清晰，速度快，最有存在感 -->
      <g class="drift-r" fill="var(--ink-3)" opacity="0.85">
        <circle cx="100"  cy="0" r="3.4" style="animation-duration:5.5s; animation-delay:0s;"/>
        <circle cx="250"  cy="0" r="2.8" style="animation-duration:6.2s; animation-delay:1.4s;"/>
        <circle cx="400"  cy="0" r="3.6" style="animation-duration:5s;   animation-delay:2.6s;"/>
        <circle cx="550"  cy="0" r="3"   style="animation-duration:6.6s; animation-delay:0.8s;"/>
        <circle cx="700"  cy="0" r="3.3" style="animation-duration:5.4s; animation-delay:3.2s;"/>
        <circle cx="850"  cy="0" r="2.9" style="animation-duration:6s;   animation-delay:1.9s;"/>
        <circle cx="1000" cy="0" r="3.5" style="animation-duration:5.2s; animation-delay:0.4s;"/>
        <circle cx="1150" cy="0" r="3.1" style="animation-duration:6.4s; animation-delay:2.9s;"/>
        <circle cx="1300" cy="0" r="3.4" style="animation-duration:5.6s; animation-delay:1.1s;"/>
        <circle cx="1400" cy="0" r="2.7" style="animation-duration:6.8s; animation-delay:3.6s;"/>
        <circle cx="30"   cy="0" r="3.2" style="animation-duration:5.8s; animation-delay:4.1s;"/>
        <circle cx="180"  cy="0" r="2.9" style="animation-duration:6.3s; animation-delay:2.1s;"/>
      </g>

    </g>

  </svg>
</div>

</body>
</html>
