<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>逆水寒丨外觀整理站</title>
<link rel="icon" href="https://images.plurk.com/32cCt1dgl8EpuhBFR4WO7S.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #f7f7f7;
  --paper-deep: #ebeced;
  --card: #fff;
  --ink: #20242b;
  --ink-soft: #4a4f57;
  --indigo: #537895;
  --indigo-deep: #09203f;
  --dan: #9c3b2e;
  --chi: #d95d4c;
  --line: #727578;
  --line-soft: #ccd2d9;
  --shadow: 0 8px 24px rgba(32, 36, 43, 0.10);
  --shadow-lift: 0 14px 34px rgba(32, 36, 43, 0.16);
  --font-display: "Noto Serif TC", serif;
  --font-body: "Open Sans", "Noto Sans TC", sans-serif;
  --font-mono: "Open Sans", "Noto Sans TC", sans-serif;
}

* { box-sizing: border-box; }
html { text-spacing-trim: space-all; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  scroll-behavior: smooth;
}

.hidden { display: none !important; }

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

  /* ---------- scrollbar ---------- */
:is(url({)),
body::-webkit-scrollbar,
:is(url(})) {
  width: 0px;
}
:is(url({)),
*::-webkit-scrollbar,
body:has(#bookmark_holder)::-webkit-scrollbar,
:is(url(})) {
  width: 5px;
}
:is(url({)),
*::-webkit-scrollbar-track,
body:is(url(})) {
  -webkit-border-radius: 10px;
  border-radius: 10px;
}
:is(url({)),
*::-webkit-scrollbar-thumb,
body:is(url(})) {
  -webkit-border-radius: 4px;
  border-radius: 4px;
  background: #1c1c1c;
}
._lch_ ~ .pop-window {
  overflow: hidden;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 32px;
  background: #222;
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  background: none;
  border: none;
  padding: 0;
  color: var(--chi);
}
.brand-mark {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 20px;
  letter-spacing: 0.06em;
}
.brand-sub {
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
}
.category-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  row-gap: 6px;
  flex: 1;
}
.tab-btn {
  position: relative;
  border: none;
  background: none;
  padding: 8px 16px;
  font-size: 15px;
  font-weight: 500;
  color: #eee;
  white-space: nowrap;
  border-radius: 6px;
  transition: color 0.2s;
}
.tab-btn:hover { color: #eee; background: #000; }
.tab-btn.active { color: #eee; }
.tab-btn.active:hover { color: #eee; }
.tab-btn.active::after {
  content: "";
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 2px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--chi));
}
.tab-group { position: relative; }
.tab-btn.parent { display: inline-flex; align-items: center; gap: 5px; }
.tab-caret { transition: transform 0.15s; flex-shrink: 0; }
.tab-group.open .tab-caret { transform: rotate(180deg); }
.tab-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 60;
  min-width: 140px;
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  box-shadow: var(--shadow-lift);
  padding: 6px;
  display: none;
}
.tab-dropdown.open { display: block; }
.tab-dropdown-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
}
.tab-dropdown-item:hover { background: var(--paper-deep); color: var(--ink); }
.tab-dropdown-item.active { color: var(--indigo-deep); font-weight: 700; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }

/* ---------- Buttons ---------- */
.btn {
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.03em;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--indigo), var(--indigo-deep) 1% );
  color: #fff;
  box-shadow: var(--shadow);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-lift);
}
.btn-ghost {
  background: transparent;
  color: var(--indigo-deep);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--paper-deep); }
.btn-danger {
  background: transparent;
  color: var(--dan);
  border: 1px solid var(--dan);
}
.btn-danger:hover { background: rgba(156, 59, 46, 0.08); }

/* ---------- Landing ---------- */
.landing {
  position: relative;
  min-height: 100vh;
  padding: 0 24px 80px;
  overflow: hidden;
}

.ink-wash {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(44, 74, 94, 0.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(76, 107, 94, 0.14), transparent 60%),
    radial-gradient(ellipse 600px 400px at 50% 100%, rgba(156, 59, 46, 0.07), transparent 60%);
}

.landing-hero {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding-top: 14vh;
  text-align: center;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--indigo);
  margin-bottom: 18px;
}
.landing-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1.25;
  margin: 0 0 20px;
  position: relative;
  display: inline-block;
}
.landing-title::after {
  content: "";
  display: block;
  width: 120px;
  height: 6px;
  margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, #09203f 30%, #537895 70%, transparent);
  border-radius: 3px;
  opacity: 0.7;
}
.landing-desc {
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink-soft);
  margin: 0 auto 36px;
  max-width: 520px;
}
.btn-info {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line-soft);
}
.btn-info:hover { background: var(--paper-deep); }

.btn-enter {
  font-size: 16px;
  padding: 14px 40px;
  border-radius: 999px;
}
.landing-hero-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.welcome-textarea {
  width: 100%;
  min-height: 220px;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
  white-space: pre-wrap;
}
.welcome-textarea.editable {
  border-color: var(--line-soft);
  background: var(--paper);
  cursor: text;
}
.welcome-textarea:focus { outline: none; }
.welcome-textarea.editable:focus { border-color: var(--indigo); }

.welcome-text-view {
  white-space: normal;
  overflow-y: auto;
  line-height: 1.6;
}
.welcome-text-view a {
  color: var(--indigo);
  text-decoration: underline;
  cursor: pointer;
}
.welcome-text-view a:hover {
  color: var(--dan)
}

.schedule-section {
  position: relative;
  z-index: 1;
  max-width: 1080px;
  margin: 10vh auto 0;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  margin: 0;
  border-left: 4px solid var(--indigo);
  padding-left: 12px;
}

.schedule-groups {
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.schedule-date-heading {
  margin: 0 0 14px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--indigo-deep);
  letter-spacing: 0.02em;
}
.schedule-grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.schedule-card {
  position: relative;
  cursor: pointer;
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 14px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.schedule-card:hover { box-shadow: var(--shadow); border-color: var(--line); }
.schedule-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.schedule-card-title {
  margin: 0;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
}
.schedule-card-icons { display: flex; gap: 8px; flex-shrink: 0; }
.schedule-card-icons .icon-btn {
  background: var(--card);
  box-shadow: none;
  backdrop-filter: none;
}
.schedule-card-icons .icon-btn:hover { background: var(--paper-deep); }
.schedule-card-note {
  margin: 0 0 14px;
  padding-left: 1em;
  text-indent: -1em;
  font-size: 12px;
  color: var(--line);
  line-height: 1.6;
  white-space: pre-wrap;
}
.schedule-card-bottom {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: auto;
}
.schedule-card-price {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--dan);
}
.schedule-card-category-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-left: auto;
}
.schedule-card-category {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: 3px 10px;
}
.schedule-empty {
  padding: 24px 0;
  color: var(--ink-soft);
  font-size: 14px;
}

/* ---------- Card grid ---------- */
.database {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 32px 100px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 28px;
}
.grid-empty {
  text-align: center;
  color: var(--ink-soft);
  padding: 80px 0;
}

.item-card {
  position: relative;
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line-soft);
  transition: transform 0.18s, box-shadow 0.18s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.item-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }

.item-card.has-special-cursor,
.item-card.has-special-cursor * { 
  cursor: url("https://images.plurk.com/2lPygcS0Eft33YEm3d36yB.png") 14 14, auto !important;
}

.card-carousel {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--paper-deep);
  overflow: hidden;
}
.card-carousel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: rgba(32, 36, 43, 0.45);
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card-carousel:hover .carousel-nav { opacity: 1; }
.carousel-nav.prev { left: 8px; }
.carousel-nav.next { right: 8px; }
.carousel-dots {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 5px;
}
.carousel-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
}
.carousel-dots span.active { background: #fff; }
.no-image {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--ink-soft);
  font-size: 13px;
}

.sale-tags {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: flex-start;
}
.sale-tags.inline {
  position: static;
  flex-direction: row;
  flex-wrap: wrap;
  margin: 8px 0;
}
.sale-tag {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 4px 10px;
  border-radius: 999px;
  background: #333;
  color: #fff;
}
.sale-tag[data-mode="永久下架"] { background: #999; }
.sale-tag[data-mode="天賞"] { background: #5a9e75; }
.sale-tag[data-mode="禮盒"] { background: #c79c38; }
.sale-tag[data-mode="限時"] { background: var(--dan); }
.sale-tag[data-mode="聯動"] { background: var(--dan); }
.sale-tag[data-mode="轉盤"] { background: #9064a1; }
.sale-tag[data-mode="現金"] { background: var(--dan); }
.sale-tag[data-mode="盲盒"] { background: var(--indigo); 
}
.card-body {
  padding: 12px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.card-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  margin: 0;
}
.card-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 12.5px;
  color: var(--ink-soft);
}
.card-meta .price { color: var(--dan); font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
.meta-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
}
.card-meta .sale-tags.card-tags { margin: 0; }
.card-meta .sale-tags.card-tags:first-of-type { margin-left: auto; }
.card-meta .sale-tags.card-tags:not(:first-of-type) { margin-left: -10px; }

.card-admin-icons {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 5;
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: rgba(246, 244, 236, 0.92);
  backdrop-filter: blur(2px);
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  transition: color 0.15s, background 0.15s;
}
.icon-btn:hover { color: var(--indigo-deep); background: #fff; }
.icon-btn.del:hover { color: var(--dan); }

/* ---------- Modals ---------- */
@keyframes modalBackdropIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modalPopIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(28, 30, 35, 0.55);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 6vh 20px;
  overflow-y: auto;
  animation: modalBackdropIn 0.18s ease;
}
.modal {
  position: relative;
  background: var(--card);
  border-radius: 16px;
  max-width: 640px;
  width: 100%;
  padding: 32px;
  box-shadow: var(--shadow-lift);
  animation: modalPopIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  border: none;
  background: var(--paper-deep);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: var(--ink-soft);
}
.modal-close:hover { color: var(--ink); }
.modal h3 {
  font-family: var(--font-display);
  margin-top: 0;
}

.login-modal form, #itemForm, .schedule-form-modal form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 8px;
}
label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}
input[type="text"], input[type="email"], input[type="password"],
input[type="date"], input[type="number"], input[type="url"],
textarea, select {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--ink);
  background: #fff;
}
textarea { resize: vertical; }
.form-error {
  color: var(--dan);
  font-size: 13px;
  margin: 0;
}
.form-row {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.form-row > label { min-width: 0; }

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 6px;
}
#schDeleteBtn { margin-right: auto; }

.tags-input { display: flex; flex-direction: column; gap: 6px; }
.field-hint {
  margin: 0;
  font-size: 11.5px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--ink-soft);}

.tags-select { position: relative; }
.tags-select-trigger {
  width: 100%;
  min-height: 42px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 6px 34px 6px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  text-align: left;
}
.tags-select-placeholder { color: var(--ink-soft); font-size: 13px; }
.tags-select-arrow {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-soft);
  font-size: 12px;
  pointer-events: none;
}
.tags-select-panel {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 20;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 6px;
  max-height: 220px;
  overflow-y: auto;
}
.tags-select-panel.hidden { display: none; }
.tags-select-option {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  color: var(--ink);
}
.tags-select-option input[type="checkbox"] {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin: 0;
}
.tags-select-option span { flex: 1; }
.tags-select-option:hover { background: var(--paper-deep); }

.image-list { display: flex; flex-direction: column; gap: 8px; }
.image-list-row { display: flex; align-items: center; gap: 8px; }
.image-list-row.dragging { opacity: 0.4; }
.image-list-row input { flex: 1; }
.drag-handle {
  cursor: grab;
  color: var(--ink-soft);
  font-size: 16px;
  padding: 0 4px;
  user-select: none;
  flex-shrink: 0;
}
.drag-handle:active { cursor: grabbing; }
.image-list-row button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  width: 36px;
  flex-shrink: 0;
  color: var(--dan);
}
.image-list-add {
  align-self: flex-start;
  border: 1px dashed var(--line);
  background: transparent;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--indigo-deep);}

/* ---------- Detail modal content ---------- */
.detail-modal { max-width: 720px; }
.detail-carousel {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--paper-deep);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
}
.detail-carousel img { width: 100%; height: 100%; object-fit: contain; background: #12141a; }
.detail-image-caption {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 3;
  max-width: calc(100% - 24px);
  margin: 0;
  padding: 5px 12px;
  border-radius: 8px;

.detail-grid {

    else leaves.push(cat);
  });

}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 2400);
}

function categoryOf(id) {
  return allLeafCategories().find((c) => c.id === id);
}

function toMillis(ts) {
  if (!ts) return 0;
  if (typeof ts.toMillis === "function") return ts.toMillis();
  if (typeof ts.seconds === "number") return ts.seconds * 1000 + (ts.nanoseconds || 0) / 1e6;
  return 0;
}

function esc(str) {
  if (str === undefined || str === null) return "";
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

function linkify(text) {
  const escaped = esc(text);
  const urlPattern = /((https?:\/\/|www\.)[^\s<]+)/gi;
  return escaped.replace(urlPattern, (match) => {
    const trailing = match.match(/[),.!?;:]+$/);
    const clean = trailing ? match.slice(0, -trailing[0].length) : match;
    const rest = trailing ? trailing[0] : "";
    const href = clean.startsWith("http") ? clean : `https://${clean}`;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${clean}</a>${rest}`;
  });
}

function renderTabs() {
  categoryTabsEl.innerHTML = "";
  CATEGORIES.forEach((cat) => {
    if (cat.children && cat.children.length) {
      const group = document.createElement("div");
      group.className = "tab-group";
      const isActiveParent = cat.children.some((c) => c.id === currentCategory);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn parent" + (isActiveParent ? " active" : "");
      btn.innerHTML = `<span>${esc(cat.label)}</span>` +
        `<svg class="tab-caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

      const dropdown = document.createElement("div");
      dropdown.className = "tab-dropdown";
      cat.children.forEach((child) => {
        const childBtn = document.createElement("button");
        childBtn.type = "button";
        childBtn.className = "tab-dropdown-item" + (child.id === currentCategory ? " active" : "");
        childBtn.textContent = child.label;
        childBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          group.classList.remove("open");
          dropdown.classList.remove("open");
          setCategory(child.id);
        });
        dropdown.appendChild(childBtn);
      });

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = !dropdown.classList.contains("open");
        document.querySelectorAll(".tab-group.open").forEach((g) => g.classList.remove("open"));
        document.querySelectorAll(".tab-dropdown.open").forEach((d) => d.classList.remove("open"));
        if (willOpen) {
          group.classList.add("open");
          dropdown.classList.add("open");
        }
      });

      group.appendChild(btn);
      group.appendChild(dropdown);
      categoryTabsEl.appendChild(group);
    } else {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (cat.id === currentCategory ? " active" : "");
      btn.textContent = cat.label;
      btn.addEventListener("click", () => setCategory(cat.id));
      categoryTabsEl.appendChild(btn);
    }
  });
}
document.addEventListener("click", () => {
  document.querySelectorAll(".tab-group.open").forEach((g) => g.classList.remove("open"));
  document.querySelectorAll(".tab-dropdown.open").forEach((d) => d.classList.remove("open"));
});

function setCategory(id) {
  currentCategory = id;
  renderTabs();
  resetFilters();
  buildFilterPanel(categoryOf(id));
  subscribeItems(id);
}

// 即時同步
// ============================================================
function subscribeItems(categoryId) {
  if (unsubItems) unsubItems();
  cardGrid.innerHTML = "";
  gridEmpty.classList.add("hidden");

  const q = query(
    collection(db, ITEMS_COLLECTION),
    where("category", "==", categoryId)
  );
  unsubItems = onSnapshot(q, (snap) => {
    const list = [];
    snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => {
      // 無日期則依陸服上線版本降序排序
      if (categoryId === "pet-gacha","other-dye") {
        return (b.cnVersion || "").localeCompare(a.cnVersion || "", undefined, { numeric: true });
      }
      const dateDiff = (b.cnDate || "").localeCompare(a.cnDate || "");
      if (dateDiff !== 0) return dateDiff;
      return toMillis(b.createdAt) - toMillis(a.createdAt);
    });
    itemsByCategory[categoryId] = list;
    if (categoryId === currentCategory) applyFilters();
  }, (err) => {
    console.error(err);
    toast("讀取資料失敗，請確認 Firebase 設定是否正確");
  });
}

function resetFilters() {
  filterState.keyword = "";
  $("#searchInput").value = "";
}

function buildFilterPanel(cat) {
  const panel = $("#filterPanel");
  panel.innerHTML = "";
  filterState.tags = new Map();
  filterState.priceRanges = {};

  const tagFields = cat.fields.filter((f) => f.type === "tags" && f.scope === "card");
  tagFields.forEach((f) => {
    const section = document.createElement("div");
    section.className = "filter-section";
    const h = document.createElement("p");
    h.className = "filter-section-title";
    h.textContent = f.label;
    section.appendChild(h);
    const pillWrap = document.createElement("div");
    pillWrap.className = "filter-pill-wrap";
    (f.options || []).forEach((opt) => {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "filter-pill";
      pill.textContent = opt;
      pill.addEventListener("click", () => {
        const tagKey = `${f.key}:${opt}`;
        const current = filterState.tags.get(tagKey);
        if (!current) {
          filterState.tags.set(tagKey, "include");
          pill.classList.add("active");
          pill.classList.remove("excluded");
       } else if (current === "include") {
          filterState.tags.set(tagKey, "exclude");
          pill.classList.remove("active");
          pill.classList.add("excluded");
       } else {
          filterState.tags.delete(tagKey);
          pill.classList.remove("active", "excluded");
       }
       applyFilters();
    });
      pillWrap.appendChild(pill);
    });
    section.appendChild(pillWrap);
    panel.appendChild(section);
  });

  const priceFields = cat.fields.filter((f) => f.type === "text" && f.scope === "card" && f.key.toLowerCase().startsWith("price"));
  priceFields.forEach((f) => {
    filterState.priceRanges[f.key] = { min: "", max: "" };
    const section = document.createElement("div");
    section.className = "filter-section";
    const h = document.createElement("p");
    h.className = "filter-section-title";
    h.textContent = `${f.label}${f.suffix ? `（${f.suffix.trim()}）` : ""}範圍`;
    section.appendChild(h);
    const rangeWrap = document.createElement("div");
    rangeWrap.className = "filter-range-wrap";
    const minInput = document.createElement("input");
    minInput.type = "number";
    minInput.placeholder = "最低";
    minInput.className = "filter-range-input";
    const maxInput = document.createElement("input");
    maxInput.type = "number";
    maxInput.placeholder = "最高";
    maxInput.className = "filter-range-input";
    minInput.addEventListener("input", () => { filterState.priceRanges[f.key].min = minInput.value; applyFilters(); });
    maxInput.addEventListener("input", () => { filterState.priceRanges[f.key].max = maxInput.value; applyFilters(); });
    rangeWrap.appendChild(minInput);
    const dash = document.createElement("span");
    dash.textContent = "–";
    rangeWrap.appendChild(dash);
    rangeWrap.appendChild(maxInput);
    section.appendChild(rangeWrap);
    panel.appendChild(section);
  });

  if (!tagFields.length && !priceFields.length) {
    const p = document.createElement("p");
    p.className = "filter-empty";
    p.textContent = "此分類尚無可篩選欄位";
    panel.appendChild(p);
  } else {
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.className = "filter-clear-btn";
    clearBtn.textContent = "清除篩選";
    clearBtn.addEventListener("click", () => {
      buildFilterPanel(cat);
      applyFilters();
    });
    panel.appendChild(clearBtn);
  }

  updateFilterCount();
}

function itemMatchesFilters(item, cat) {
  if (filterState.keyword) {
    const kw = filterState.keyword.toLowerCase();
    if (!(item.name || "").toLowerCase().includes(kw)) return false;
  }

  const tagFields = cat.fields.filter((f) => f.type === "tags" && f.scope === "card");
  for (const f of tagFields) {
    const prefix = `${f.key}:`;
    const itemValues = Array.isArray(item[f.key]) ? item[f.key] : (item[f.key] ? [item[f.key]] : []);
    let ok = true;
    filterState.tags.forEach((mode, tagKey) => {
      if (!tagKey.startsWith(prefix)) return;
      const value = tagKey.slice(prefix.length);
      if (mode === "exclude") {
        if (itemValues.includes(value)) ok = false;
      } else {
        if (!itemValues.includes(value)) ok = false;
      }
    });
    if (!ok) return false;
  }

  for (const [key, range] of Object.entries(filterState.priceRanges)) {
    if (range.min === "" && range.max === "") continue;
    const raw = item[key];
    const num = (raw !== undefined && raw !== null && raw !== "")
      ? parseFloat(String(raw).replace(/[^\d.-]/g, ""))
      : NaN;
    if (Number.isNaN(num)) return false;
    if (range.min !== "" && num < parseFloat(range.min)) return false;
    if (range.max !== "" && num > parseFloat(range.max)) return false;
  }

  return true;
}

function applyFilters() {
  const cat = categoryOf(currentCategory);
  const list = itemsByCategory[currentCategory] || [];
  const filtered = list.filter((item) => itemMatchesFilters(item, cat));
  gridEmpty.textContent = (list.length > 0 && filtered.length === 0)
    ? "沒有符合篩選條件的外觀"
    : "此分類目前尚無資料";
  renderCards(filtered);
  updateFilterCount();
}

function updateFilterCount() {
  const priceActive = Object.values(filterState.priceRanges).filter((r) => r.min !== "" || r.max !== "").length;
  const count = filterState.tags.size + priceActive;
  const el = $("#filterCount");
  el.textContent = String(count);
  el.classList.toggle("hidden", count === 0);
}

$("#searchInput").addEventListener("input", (e) => {
  filterState.keyword = e.target.value.trim();
  applyFilters();
});

function renderCards(list) {
  cardGrid.innerHTML = "";
  gridEmpty.classList.toggle("hidden", list.length > 0);
  const cat = categoryOf(currentCategory);

  list.forEach((item) => {
    const card = document.createElement("div");
    card.className = "item-card";

    // --- 管理員圖示 ---
    if (currentUser) {
      const icons = document.createElement("div");
      icons.className = "card-admin-icons";
      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn edit";
      editBtn.setAttribute("aria-label", "編輯");
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
      editBtn.addEventListener("click", (e) => { e.stopPropagation(); openItemForm(cat, item); });
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn del";
      delBtn.setAttribute("aria-label", "刪除");
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>';
      delBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (confirm(`確定要刪除「${item.name || "此項目"}」嗎？`)) {
          await deleteDoc(doc(db, ITEMS_COLLECTION, item.id));
          toast("已刪除");
        }
      });
      icons.appendChild(editBtn);
      icons.appendChild(delBtn);
      card.appendChild(icons);
    }

    // --- 圖片輪播 ---
    const carousel = document.createElement("div");
    carousel.className = "card-carousel";
    const images = item.images || [];
    let imgIndex = 0;

    const imgEl = document.createElement("img");
    imgEl.referrerPolicy = "no-referrer";
    const noImg = document.createElement("div");
    noImg.className = "no-image";
    noImg.textContent = "尚無預覽圖";

    function renderImg() {
      if (images.length === 0) {
        imgEl.classList.add("hidden");
        noImg.classList.remove("hidden");
        return;
      }
      imgEl.classList.remove("hidden");
      noImg.classList.add("hidden");
      const img = images[imgIndex];
      imgEl.src = typeof img === "string" ? img : (img && img.url) || "";
      imgEl.alt = item.name || "";
    }
    renderImg();
    carousel.appendChild(imgEl);
    carousel.appendChild(noImg);

    if (images.length > 1) {
      const prev = document.createElement("button");
      prev.className = "carousel-nav prev";
      prev.textContent = "‹";
      prev.addEventListener("click", (e) => {
        e.stopPropagation();
        imgIndex = (imgIndex - 1 + images.length) % images.length;
        renderImg();
        renderDots();
      });
      const next = document.createElement("button");
      next.className = "carousel-nav next";
      next.textContent = "›";
      next.addEventListener("click", (e) => {
        e.stopPropagation();
        imgIndex = (imgIndex + 1) % images.length;
        renderImg();
        renderDots();
      });
      carousel.appendChild(prev);
      carousel.appendChild(next);

      const dots = document.createElement("div");
      dots.className = "carousel-dots";
      function renderDots() {
        dots.innerHTML = "";
        images.forEach((_, i) => {
          const d = document.createElement("span");
          if (i === imgIndex) d.classList.add("active");
          dots.appendChild(d);
        });
      }
      renderDots();
      carousel.appendChild(dots);
    }

    // --- 卡片內容 ---
    const body = document.createElement("div");
    body.className = "card-body";

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = item.name || "（未命名）";
    body.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "card-meta";
   cat.fields
    .filter((f) => f.type === "text" && f.scope === "card")
    .forEach((f) => {
      if (!item[f.key]) return;
      const suffix = f.suffix ? esc(f.suffix) : "";
      meta.innerHTML += `<span class="price"><span class="meta-label">${esc(f.label)}</span>${esc(item[f.key])}${suffix}</span>`;
  });
    body.appendChild(meta);

    cat.fields
  .filter((f) => f.type === "tags" && f.scope === "card")
  .forEach((f) => {
    const values = Array.isArray(item[f.key]) ? item[f.key] : (item[f.key] ? [item[f.key]] : []);
    if (!values.length) return;
    const tagWrap = document.createElement("div");
    tagWrap.className = "sale-tags inline card-tags";
    values.forEach((v) => {
      const tag = document.createElement("span");
      tag.className = "sale-tag";
      tag.dataset.mode = v;
      tag.textContent = v;
      tagWrap.appendChild(tag);
    });
    meta.appendChild(tagWrap);
  });

    card.appendChild(carousel);
    card.appendChild(body);

    const hasSpecialCursor =
      item.priceTS != null && String(item.priceTS).trim() !== "" ||
      item.hairstyle != null && String(item.hairstyle).trim() !== "";

    if (hasSpecialCursor) {
      card.classList.add("has-special-cursor");
    }

    card.addEventListener("click", () => openDetail(cat, item));
    cardGrid.appendChild(card);
  });
}

function openDetail(cat, item) {
  const images = item.images || [];
  let idx = 0;
  const content = $("#detailContent");
  content.innerHTML = "";

  function imgUrl(img) { return typeof img === "string" ? img : (img && img.url) || ""; }
  function imgCaption(img) { return (img && typeof img === "object" && img.caption) || ""; }

  const carousel = document.createElement("div");
  carousel.className = "detail-carousel";
  const imgEl = document.createElement("img");
  imgEl.referrerPolicy = "no-referrer";
  const captionEl = document.createElement("p");
  captionEl.className = "detail-image-caption";
  function renderImg() {
    if (images.length === 0) {
      imgEl.src = "";
      imgEl.style.display = "none";
      captionEl.classList.add("hidden");
    } else {
      imgEl.style.display = "block";
      imgEl.src = imgUrl(images[idx]);
      const cap = imgCaption(images[idx]);
      captionEl.textContent = cap;
      captionEl.classList.toggle("hidden", !cap);
    }
  }
  renderImg();
  carousel.appendChild(imgEl);
  carousel.appendChild(captionEl);
  if (images.length > 1) {
    const prev = document.createElement("button");
    prev.className = "carousel-nav prev";
    prev.textContent = "‹";
    prev.style.opacity = 1;
    prev.addEventListener("click", () => { idx = (idx - 1 + images.length) % images.length; renderImg(); });
    const next = document.createElement("button");
    next.className = "carousel-nav next";
    next.textContent = "›";
    next.style.opacity = 1;
    next.addEventListener("click", () => { idx = (idx + 1) % images.length; renderImg(); });
    carousel.appendChild(prev);
    carousel.appendChild(next);
  }
  content.appendChild(carousel);

  const h = document.createElement("h2");
  h.className = "detail-title";
  h.textContent = item.name || "（未命名）";
  content.appendChild(h);

  const isPets = ["pet-spirit", "pet-direct"].includes(cat.id);

  function buildAnnouncementLink() {
    if (!item.announcementUrl) return null;
    const annLink = document.createElement("a");
    annLink.className = "announcement-link";
    annLink.href = item.announcementUrl;
    annLink.target = "_blank";
    annLink.rel = "noopener noreferrer";
    annLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg><span>查看公告</span>';
    return annLink;
  }

  const saleWrap = document.createElement("div");
  saleWrap.className = "detail-sale-row";

  // 寵物專屬版型
  if (isPets) {
    const priceWrap = document.createElement("div");
    priceWrap.className = "detail-pets-price";
    cat.fields
      .filter((f) => f.type === "text" && f.scope === "card" && f.key.toLowerCase().startsWith("price"))
      .forEach((f) => {
        if (!item[f.key]) return;
        const span = document.createElement("span");
        span.className = "price";
        span.innerHTML = `<span class="meta-label">${esc(f.label)}</span>${esc(item[f.key])}${f.suffix ? esc(f.suffix) : ""}`;
        priceWrap.appendChild(span);
      });
    saleWrap.appendChild(priceWrap);

    const rightWrap = document.createElement("div");
    rightWrap.className = "detail-sale-row-right";
    const tagWrap = document.createElement("div");
    tagWrap.className = "sale-tags inline";
    cat.fields
      .filter((f) => f.type === "tags" && f.scope === "card")
      .forEach((f) => {
        const values = Array.isArray(item[f.key]) ? item[f.key] : (item[f.key] ? [item[f.key]] : []);
        values.forEach((v) => {
          const tag = document.createElement("span");
          tag.className = "sale-tag";
          tag.dataset.mode = v;
          tag.textContent = v;
          tagWrap.appendChild(tag);
        });
      });
    if (tagWrap.children.length) rightWrap.appendChild(tagWrap);
    const annLink = buildAnnouncementLink();
    if (annLink) rightWrap.appendChild(annLink);
    saleWrap.appendChild(rightWrap);
  } else {
    const detailSaleModes = Array.isArray(item.saleMode) ? item.saleMode : (item.saleMode ? [item.saleMode] : []);
    const tagWrap = document.createElement("div");
    tagWrap.className = "sale-tags inline";
    detailSaleModes.forEach((mode) => {
      const tag = document.createElement("span");
      tag.className = "sale-tag";
      tag.dataset.mode = mode;
      tag.textContent = mode;
      tagWrap.appendChild(tag);
    });
    saleWrap.appendChild(tagWrap);
    const annLink = buildAnnouncementLink();
    if (annLink) saleWrap.appendChild(annLink);
  }
  content.appendChild(saleWrap);

  const grid = document.createElement("div");
  grid.className = "detail-grid";

  if (isPets) {
    const PETS_GRID_SPEC = [
      { key: "shiny", label: "偏色" },
      { key: "cnDate", label: "陸服日期" },
      { key: "cnVersion", label: "陸服版本" },
      { key: "class", label: "品級" },
      { key: "twDate", label: "台服日期" },
      { key: "twVersion", label: "台服版本" },
    ];
    PETS_GRID_SPEC.forEach((spec) => {
      const val = item[spec.key];
      const wrap = document.createElement("div");
      wrap.className = "detail-field";
      wrap.innerHTML = `<label>${esc(spec.label)}</label><div class="val">${val ? esc(val) : " - "}</div>`;
      grid.appendChild(wrap);
    });
  } else {
    const HIDE_IF_EMPTY = ["priceYU", "priceTS"];
    cat.fields.forEach((f) => {
      if (["images", "textarea", "tags", "url"].includes(f.type)) return;
      const val = item[f.key];
      const suffix = (val && f.suffix) ? esc(f.suffix) : "";
      if (!val) {
        if (HIDE_IF_EMPTY.includes(f.key)) return;
        const wrap = document.createElement("div");
        wrap.className = "detail-field";
        wrap.innerHTML = `<label>${esc(f.label)}</label><div class="val"> - </div>`;
        grid.appendChild(wrap);
        return;
      }
      const wrap = document.createElement("div");
      wrap.className = "detail-field";
      wrap.innerHTML = `<label>${esc(f.label)}</label><div class="val">${esc(val)}${suffix}</div>`;
      grid.appendChild(wrap);
    });
  }

  content.appendChild(grid);

  const notesWrap = document.createElement("div");
  notesWrap.className = "detail-field";
  notesWrap.innerHTML = `<label style="font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:6px;">備註</label>`;
  const notes = document.createElement("div");
  notes.className = "detail-notes";
  notes.innerHTML = item.notes ? linkify(item.notes) : " - ";
  notesWrap.appendChild(notes);
  content.appendChild(notesWrap);

  $("#detailModal").classList.remove("hidden");
}

function openItemForm(cat, item) {
  editingItemId = item ? item.id : null;
  $("#itemFormTitle").textContent = item ? `編輯：${item.name || ""}` : `新增${cat.label}`;
  const form = $("#itemForm");
  form.innerHTML = "";

  function fieldByKey(key) {
    return cat.fields.find((f) => f.key === key);
  }

  function buildInputForField(f) {
    switch (f.type) {
      case "select":
        return buildSelect(`f_${f.key}`, f.options, item?.[f.key]);
      case "tags":
        return buildTagsInput(`f_${f.key}`, item?.[f.key] || [], f.options);
      case "date":
        return buildInput("date", `f_${f.key}`, item?.[f.key] || "");
      case "textarea": {
        const ta = document.createElement("textarea");
        ta.id = `f_${f.key}`;
        ta.rows = 4;
        ta.value = item?.[f.key] || "";
        return ta;
      }
      case "images":
        return buildImageList(`f_${f.key}`, item?.[f.key] || []);
      case "version": {
        const el = buildInput("text", `f_${f.key}`, item?.[f.key] || "");
        el.placeholder = " ";
        return el;
      }
      case "url": {
        const el = buildInput("url", `f_${f.key}`, item?.[f.key] || "");
        el.placeholder = "https://...";
        return el;
      }
      default:
        const el = buildInput("text", `f_${f.key}`, item?.[f.key] || "");
        if (f.suffix) el.placeholder = `${f.suffix.trim()}售價`;
        return el;
    }
  }

  function buildCell(key) {
    if (key === "name") {
      return buildLabel("名稱", buildInput("text", "f_name", item?.name || "", true));
    }
    const f = fieldByKey(key);
    if (!f) return null;
    return buildLabel(f.label, buildInputForField(f));
  }

  const layout = cat.formLayout || [[{ key: "name", width: 100 }]];
  layout.forEach((row) => {
    const rowEl = document.createElement("div");
    rowEl.className = "form-row";
    row.forEach(({ key, width }) => {
      const cell = buildCell(key);
      if (!cell) return;
      cell.style.flex = String(width);
      rowEl.appendChild(cell);
    });
    if (rowEl.children.length) form.appendChild(rowEl);
  });

  const actions = document.createElement("div");
  actions.className = "form-actions";
  actions.innerHTML = `<button type="submit" class="btn btn-primary">儲存</button>`;
  form.appendChild(actions);

  $("#itemFormModal").classList.remove("hidden");
}

function buildLabel(text, inputEl) {
  const label = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = text;
  label.appendChild(span);
  label.appendChild(inputEl);
  return label;
}
function buildInput(type, id, value, required) {
  const input = document.createElement("input");
  input.type = type;
  input.id = id;
  input.value = value || "";
  if (required) input.required = true;
  return input;
}
function buildSelect(id, options, value) {
  const select = document.createElement("select");
  select.id = id;
  const blank = document.createElement("option");
  blank.value = "";
  blank.textContent = "請選擇";
  select.appendChild(blank);
  options.forEach((opt) => {
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = opt;
    if (opt === value) o.selected = true;
    select.appendChild(o);
  });
  return select;
}
function buildTagsInput(id, values, hintOptions) {
  const options = hintOptions && hintOptions.length ? hintOptions : null;
  if (!options) {
    const wrap = document.createElement("div");
    wrap.className = "tags-input";
    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.placeholder = "以逗號分隔多個標籤";
    input.value = (values || []).join(", ");
    wrap.appendChild(input);
    return wrap;
  }
  const selected = new Set(values || []);
  const wrap = document.createElement("div");
  wrap.className = "tags-select";

  const hidden = document.createElement("input");
  hidden.type = "hidden";
  hidden.id = id;
  hidden.value = Array.from(selected).join(", ");
  wrap.appendChild(hidden);

  const trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className = "tags-select-trigger";
  wrap.appendChild(trigger);

  const panel = document.createElement("div");
  panel.className = "tags-select-panel hidden";
  options.forEach((opt) => {
    const label = document.createElement("label");
    label.className = "tags-select-option";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = opt;
    cb.checked = selected.has(opt);
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(opt); else selected.delete(opt);
      hidden.value = Array.from(selected).join(", ");
      renderTrigger();
    });
    const span = document.createElement("span");
    span.textContent = opt;
    label.appendChild(cb);
    label.appendChild(span);
    panel.appendChild(label);
  });
  wrap.appendChild(panel);

  function renderTrigger() {
    trigger.innerHTML = "";
    if (!selected.size) {
      const ph = document.createElement("span");
      ph.className = "tags-select-placeholder";
      ph.textContent = "請選擇…";
      trigger.appendChild(ph);
    } else {
      Array.from(selected).forEach((v) => {
        const chip = document.createElement("span");
        chip.className = "sale-tag";
        chip.dataset.mode = v;
        chip.textContent = v;
        trigger.appendChild(chip);
      });
    }
    const arrow = document.createElement("span");
    arrow.className = "tags-select-arrow";
    arrow.textContent = "▾";
    trigger.appendChild(arrow);
  }
  renderTrigger();

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    panel.classList.toggle("hidden");
  });
  document.addEventListener("click", (e) => {
    if (!wrap.contains(e.target)) panel.classList.add("hidden");
  });

  return wrap;
}

function collectTags(id) {
  const input = document.getElementById(id);
  if (!input) return [];
  return input.value.split(",").map((s) => s.trim()).filter(Boolean);
}
function buildImageList(id, values) {
  const wrap = document.createElement("div");
  wrap.className = "image-list";
  wrap.id = id;
  let dragSrcRow = null;

  function addRow(entry) {
    const urlVal = typeof entry === "string" ? entry : (entry && entry.url) || "";
    const capVal = (entry && typeof entry === "object" && entry.caption) || "";

    const row = document.createElement("div");
    row.className = "image-list-row";

    const handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.draggable = true;
    handle.textContent = "⠿";
    handle.title = "拖曳調整順序";

    const urlInput = document.createElement("input");
    urlInput.type = "url";
    urlInput.className = "image-url-input";
    urlInput.placeholder = "圖片網址 https://...";
    urlInput.value = urlVal;

    const capInput = document.createElement("input");
    capInput.type = "text";
    capInput.className = "image-caption-input";
    capInput.placeholder = "說明文字（選填）";
    capInput.value = capVal;

    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "✕";
    rm.addEventListener("click", () => row.remove());

    row.appendChild(handle);
    row.appendChild(urlInput);
    row.appendChild(capInput);
    row.appendChild(rm);

    handle.addEventListener("dragstart", (e) => {
      dragSrcRow = row;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    handle.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      dragSrcRow = null;
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!dragSrcRow || dragSrcRow === row) return;
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      wrap.insertBefore(dragSrcRow, after ? row.nextSibling : row);
    });

    wrap.insertBefore(row, addBtn);
  }

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "image-list-add";
  addBtn.textContent = "＋ 新增圖片";
  addBtn.addEventListener("click", () => addRow(""));

  wrap.appendChild(addBtn);
  (values.length ? values : [""]).forEach(addRow);
  return wrap;
}
function collectImageList(id) {
  return Array.from(document.querySelectorAll(`#${id} .image-list-row`))
    .map((row) => ({
      url: row.querySelector(".image-url-input").value.trim(),
      caption: row.querySelector(".image-caption-input").value.trim(),
    }))
    .filter((entry) => entry.url);
}

// ============================================================
// 台服上新時程
// ============================================================
const OUTFIT_JUMP_MAP = {
  "聯動": " ", "限時": " ",
  "時裝": "fashion", "戰令": "fashion-pass", "免費時裝": "fashion-free",
  "轉盤": "roulette",
  "武器": "weapon-school", "承影": "weapon-chengying",
  "祥瑞": "mount-auspicious", "坐騎": "mount-mount",
  "絕技": "skill-ultimate", "群俠": "skill-qunxia", "輕功": "skill-lightfoot",
  "靈寵": "pet-spirit", "寵物": "pet-direct",
  "俠棋": "chess-board",
  "單品": "item", "盲盒": "item-blindbox", 
  "莊園": "other-manor",
};
const outfit = Object.keys(OUTFIT_JUMP_MAP);

function subscribeSchedule() {
  const q = query(collection(db, SCHEDULE_COLLECTION), orderBy("date", "asc"));
  onSnapshot(q, (snap) => {
    scheduleEntries = [];
    snap.forEach((d) => scheduleEntries.push({ id: d.id, ...d.data() }));
    renderSchedule();
  }, (err) => {
    console.error(err);
  });
}

async function openScheduleTargetDetail(entry) {
  const categories = Array.isArray(entry.category) ? entry.category : (entry.category ? [entry.category] : []);
  const catIds = categories.map((label) => OUTFIT_JUMP_MAP[label]).filter(Boolean);
  if (!catIds.length) {
    toast("此筆時程尚未設定分類，無法開啟詳細資料");
    return;
  }
  const cleanTitle = (entry.title || "").replace(/[（(].*?[）)]/g, "").trim();
  for (const catId of catIds) {
    const cat = categoryOf(catId);
    if (!cat) continue;
    try {
      const snap = await getDocs(query(collection(db, ITEMS_COLLECTION), where("category", "==", catId)));
      let matched = null;
      snap.forEach((d) => {
        if (matched) return;
        const data = d.data();
        const name = (data.name || "").trim();
        if (!name) return;
        if (name === cleanTitle || name.includes(cleanTitle) || cleanTitle.includes(name)) {
          matched = { id: d.id, ...data };
        }
      });
      if (matched) {
        openDetail(cat, matched);
        return;
      }
    } catch (err) {
      console.error(err);
    }
  }
  toast("找不到對應的外觀資料");
}

// 卡片排序依照分類標籤優先順序：轉盤 → 祥瑞 → 時裝 → 武器 → ... 依此類推
const CATEGORY_SORT_ORDER = ["轉盤", "祥瑞", "時裝", "武器", "技能", "輕功", "寵物", "坐騎", "俠棋", "莊園"];
function categoryRank(entry) {
  const categories = Array.isArray(entry.category) ? entry.category : (entry.category ? [entry.category] : []);
  let best = Infinity;
  categories.forEach((label) => {
    const idx = CATEGORY_SORT_ORDER.indexOf(label);
    if (idx !== -1 && idx < best) best = idx;
  });
  return best;
}

function renderSchedule() {
  scheduleList.innerHTML = "";
  if (scheduleEntries.length === 0) {
    scheduleList.appendChild(scheduleEmpty);
    return;
  }

  // 先依日期分組（scheduleEntries 已由 Firestore 查詢依日期由舊到新排序，Map 會保留這個插入順序）
  const groups = new Map();
  scheduleEntries.forEach((entry) => {
    const key = entry.date || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(entry);
  });

  groups.forEach((entriesOfDate, date) => {
    const groupEl = document.createElement("div");
    groupEl.className = "schedule-group";

    const heading = document.createElement("h3");
    heading.className = "schedule-date-heading mono";
    heading.textContent = date;
    groupEl.appendChild(heading);

    const grid = document.createElement("ol");
    grid.className = "schedule-grid";

    const sorted = [...entriesOfDate].sort((a, b) => categoryRank(a) - categoryRank(b));

    sorted.forEach((entry) => {
      const categories = Array.isArray(entry.category) ? entry.category : (entry.category ? [entry.category] : []);

      const li = document.createElement("li");
      li.className = "schedule-card";
      li.addEventListener("click", () => openScheduleTargetDetail(entry));

      const head = document.createElement("div");
      head.className = "schedule-card-head";

      const titleEl = document.createElement("p");
      titleEl.className = "schedule-card-title";
      titleEl.textContent = entry.title || "";
      head.appendChild(titleEl);

      if (currentUser) {
        const icons = document.createElement("div");
        icons.className = "schedule-card-icons";
        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn edit";
        editBtn.setAttribute("aria-label", "編輯");
        editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
        editBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openScheduleForm(entry);
        });
        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn del";
        delBtn.setAttribute("aria-label", "刪除");
        delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>';
        delBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (confirm(`確定要刪除「${entry.title || "此筆時程"}」嗎？`)) {
            await deleteDoc(doc(db, SCHEDULE_COLLECTION, entry.id));
            toast("已刪除");
          }
        });
        icons.appendChild(editBtn);
        icons.appendChild(delBtn);
        head.appendChild(icons);
      }

      li.appendChild(head);

      if (entry.note) {
        const noteEl = document.createElement("p");
        noteEl.className = "schedule-card-note";
        noteEl.textContent = entry.note;
        li.appendChild(noteEl);
      }

      const bottom = document.createElement("div");
      bottom.className = "schedule-card-bottom";

      if (entry.price) {
        const priceEl = document.createElement("p");
        priceEl.className = "schedule-card-price";
        priceEl.textContent = entry.price;
        bottom.appendChild(priceEl);
      }

      if (categories.length) {
        const pillWrap = document.createElement("div");
        pillWrap.className = "schedule-card-category-wrap";
        categories.forEach((label) => {
          const pill = document.createElement("span");
          pill.className = "schedule-card-category";
          pill.textContent = label;
          pillWrap.appendChild(pill);
        });
        bottom.appendChild(pillWrap);
      }

      li.appendChild(bottom);
      grid.appendChild(li);
    });

    groupEl.appendChild(grid);
    scheduleList.appendChild(groupEl);
  });
}

$("#btnAddSchedule").addEventListener("click", () => openScheduleForm(null));

let editingScheduleId = null;

  editingScheduleId = entry ? entry.id : null;
  $("#scheduleFormTitle").textContent = entry ? "編輯上新時程" : "新增上新時程";

// 使用說明
// ============================================================
const WELCOME_DOC = doc(db, "settings", "welcomeNotice");
let welcomeText = "";

function linkifyText(text) {
  const escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

  return escaped
    .replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    )
    .replace(/\n/g, "<br>");
}
function updateWelcomeEditState() {
  const ta = $("#welcomeText");
  const view = $("#welcomeTextView");
  const isAdmin = !!currentUser;
  ta.readOnly = !isAdmin;
  ta.classList.toggle("editable", isAdmin);
  $("#welcomeSaveWrap").classList.toggle("hidden", !isAdmin);
  if (isAdmin) {
    ta.classList.remove("hidden");
    view.classList.add("hidden");
  } else {
    ta.classList.add("hidden");
    view.classList.remove("hidden");
    view.innerHTML = linkifyText(welcomeText);
  }
}

function openWelcomeModal() {
  $("#welcomeText").value = welcomeText;
  updateWelcomeEditState();
  $("#welcomeModal").classList.remove("hidden");
}
function maybeShowWelcomeOnFirstVisit() {
  if (localStorage.getItem("hasSeenWelcome")) return;
  localStorage.setItem("hasSeenWelcome", "1");
  openWelcomeModal();
}

function subscribeWelcomeNotice() {
  onSnapshot(WELCOME_DOC, (snap) => {
    welcomeText = snap.exists()
      ? (snap.data().text || "")
      : "";

    $("#welcomeText").value = welcomeText;

    if (!$("#welcomeModal").classList.contains("hidden")) {
      updateWelcomeEditState();
    }

    maybeShowWelcomeOnFirstVisit();

  }, (err) => {
    console.error(err);
  });
}

$("#btnWelcomeInfo").addEventListener("click", openWelcomeModal);

$("#welcomeSaveBtn").addEventListener("click", async () => {
  try {
    await setDoc(WELCOME_DOC, { text: $("#welcomeText").value }, { merge: true });
    toast("已更新使用說明");
  } catch (err) {
    console.error(err);
    toast("儲存失敗，請確認是否已登入管理員帳號");
  }
});
